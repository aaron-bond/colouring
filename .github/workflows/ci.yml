name: CI and deploy

# Tests run on every push and pull request. Pushes to main deploy to
# GitHub Pages only if every blocking test passed. Deploys use GitHub's
# own Pages actions (no gh-pages branch). In the repository settings,
# Pages > Source must be "GitHub Actions".

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npx ng test --watch=false

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: End-to-end tests (Chromium, the MVP target)
        run: npx playwright test --project=tablet-landscape --project=tablet-portrait --project=desktop

      # iPad isn't an MVP target: WebKit failures are reported, not blocking.
      - name: End-to-end tests (WebKit, informational)
        continue-on-error: true
        run: npx playwright test --project=webkit-ipad

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Build
        run: npx ng build --base-href /colouring/

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist/colouring/browser

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
